# nRF54L15 Audio Receiver Configuration
#

# General System & Kernel
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_FPU=y
CONFIG_EVENTS=y
CONFIG_RING_BUFFER=y

# Logging & Assertions
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_ASSERT=y

# Bluetooth LE Configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF54L15-Audio-Sink"
CONFIG_BT_DEVICE_APPEARANCE=2064
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# High-Throughput BLE Parameters (16x 502-byte hardware packet buffers)
CONFIG_BT_BUF_ACL_RX_COUNT=16
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_GATT_DYNAMIC_DB=y

# Bluetooth Controller Tuning for High Data Rate
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# I2S Driver for MAX98357A
CONFIG_I2S=y
CONFIG_I2S_NRFX=y

# Flash Storage & LittleFS (For Onboard/External Flash)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_SPI_NOR=y

# Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# GPIO & Pin Control
CONFIG_GPIO=y
CONFIG_PINCTRL=y
